name: Repository and isolated fixture checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up fixed native cache integration runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Select real Node and npm 10.9.2 implementation
        run: |
          $probe = @'
          import json, os, pathlib, platform, shutil, subprocess, sys
          node = pathlib.Path(shutil.which('node')).resolve(strict=True)
          choices = [node.parent / 'node_modules/npm/bin/npm-cli.js', node.parent.parent / 'lib/node_modules/npm/bin/npm-cli.js']
          cli = next((p.resolve(strict=True) for p in choices if p.is_file()), None)
          if cli is None:
              raise SystemExit('Fixed Node distribution lacks npm-cli.js')
          version = json.loads((cli.parent.parent / 'package.json').read_text(encoding='utf-8'))['version']
          if version != '10.9.2':
              raise SystemExit('Expected reviewed npm 10.9.2; native integration must not silently skip')
          print(json.dumps({'node': str(node), 'npm_cli': str(cli), 'npm_version': version,
              'node_version': subprocess.check_output([str(node), '--version'], text=True).strip(),
              'python': platform.python_version(), 'system': sys.platform, 'machine': platform.machine(),
              'runner_os': os.environ.get('RUNNER_OS'), 'runner_arch': os.environ.get('RUNNER_ARCH'),
              'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion')}))
          '@
          $paths = ($probe | python -I -B -) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('STORAGE_TEST_NODE=' + $paths.node)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('STORAGE_TEST_NPM_CLI=' + $paths.npm_cli)
          Write-Output ('Native cache integration: Node22.14.0 / npm' + $paths.npm_version)
          Write-Output ('RUNTIME_ENVIRONMENT=' + ($paths | Select-Object python,system,machine,runner_os,runner_arch,image_os,image_version,node_version,npm_version | ConvertTo-Json -Compress))
      - name: Install validation-only dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Validate public repository
        run: python -I -B tools/validate_repository.py --repo . --require-yaml
      - name: Run isolated portable suites
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ('storage-skill-tests-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $suites = @('test_storage_guard', 'test_storage_modes', 'test_project_profiler', 'test_generated_artifacts', 'test_native_cache', 'test_state_boundaries', 'test_release_tools', 'test_macos_acl', 'test_retired_runtime_guard', 'test_npm_cache_guard', 'test_agent_waste_discovery', 'test_agent_artifact_guard', 'test_agent_state_boundaries')
          $failedSuites = @()
          foreach ($suite in $suites) {
            Write-Output ('STORAGE_SUITE=' + $suite)
            $suiteRoot = Join-Path $testRoot $suite
            New-Item -ItemType Directory -Path $suiteRoot | Out-Null
            if ($suite -eq 'test_npm_cache_guard') {
              python -I -B ('tests/' + $suite + '.py') --work-root $suiteRoot --integration-node $env:STORAGE_TEST_NODE --integration-npm-cli $env:STORAGE_TEST_NPM_CLI
            } else {
              python -I -B ('tests/' + $suite + '.py') --work-root $suiteRoot
            }
            $suiteExit = $LASTEXITCODE
            if ($suiteExit -ne 0) {
              $failedSuites += $suite
              Write-Output ('STORAGE_SUITE_FAILED=' + $suite + ';exit=' + $suiteExit)
            }
          }
          if ($failedSuites.Count -ne 0) {
            Write-Output ('Failed suites: ' + ($failedSuites -join ', '))
            exit 1
          }
      - name: Build curated distribution outside source tree
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP ('storage-skill-package-' + [guid]::NewGuid().ToString('N'))
          python -I -B tools/build_release.py --repo . --output-dir $packageRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Local build only; this workflow does not publish a GitHub Release.'
