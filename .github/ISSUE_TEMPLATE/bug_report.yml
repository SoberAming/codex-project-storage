name: Bug report / 问题报告
description: Report reproducible behavior in a supported route using fictional data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use a small fictional reproduction. Do not upload sessions, indexes, databases, credentials, customer files, raw disk reports, or full logs.
        For a possible security flaw or protected-boundary bypass, use SECURITY.md and keep details private.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope / 隐私与范围
      options:
        - label: I reviewed and redacted private paths, names, credentials, and user content.
          required: true
        - label: This public report contains no security exploit details and uses fictional sample data.
          required: true
        - label: I checked the relevant documentation and existing issues.
          required: true
  - type: input
    id: version
    attributes:
      label: Skill release or commit / 版本
      placeholder: v1.3.0 or commit identifier
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows
        - macOS
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment / 相关环境
      description: OS version, Python version, host, filesystem type, and relevant tool version only. Do not paste environment variables or machine identifiers.
      placeholder: Windows version; Python version; host; filesystem; optional pip version
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Affected phase / 阶段
      options:
        - Analysis or volume discovery
        - Plan generation
        - Exact-file deletion
        - Native cache operation
        - Copy or retained-copy verification
        - Usage acceptance or source release
        - Documentation or other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fictional reproduction / 虚构样本复现
      description: Give a small directory layout, requested operation, and minimal steps. Do not repeat a stopped operation against real data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior / 实际
      description: Include a short redacted error or status. Keep plans, receipts, and checkpoints locally; do not attach whole reports.
    validations:
      required: true
