name: Feature request / 能力建议
description: Propose a project type, analysis improvement, or evidence-based action route.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user's problem and data lifecycle. A large or old directory is not sufficient evidence for deletion.
        Use fictional examples and omit private project data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前
      options:
        - label: This proposal contains no private files, credentials, raw personal reports, or sensitive paths.
          required: true
        - label: I checked existing documentation and issues.
          required: true
  - type: textarea
    id: task
    attributes:
      label: User task and problem / 用户任务
      description: What does the user need to achieve, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: producer
    attributes:
      label: Producer and data lifecycle / 生产者与生命周期
      description: Name the tool or workflow, project-local versus shared ownership, active references, and why the data grows. State what is unknown.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome / 建议结果
      description: Analysis, deletion, migration, or a combination. Explain retention, reconstruction or retrieval, and usage impact. Do not propose a generic force-delete list.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safe test / 依据与安全测试
      description: Link official documentation and describe a small fictional test, including what must remain protected. Do not upload real sessions or data.
    validations:
      required: false
