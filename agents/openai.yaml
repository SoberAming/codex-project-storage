interface:
  display_name: "Agent 开发产物清理"
  short_description: "识别并精确清理Agent任务的无效产物，及时腾出空间，保护项目、会话和索引"
  default_prompt: "使用 $codex-project-storage 查清当前项目中Agent开发留下的主要残留，核实真实生产工具、对应任务与结束记录、保留成果、当前引用和读写；优先给我清理已核实无效产物的推荐方案，迁移仅用于有保存价值的停用产物。你负责技术判断，我决定采用结果。保护源码、原始素材、有效成果、会话、索引、业务数据库和恢复资料，执行后核验项目及实际释放空间。"
policy:
  allow_implicit_invocation: true
